<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatForge &mdash; Browser Drum Machine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>BeatForge</h1>
  <p class="subtitle">A 16-step drum machine, synthesized entirely in the Web Audio API. No samples, no build step.</p>
</header>

<main class="app">
  <section class="transport" aria-label="Transport controls">
    <button id="playBtn" class="btn btn-primary" aria-pressed="false">Play</button>
    <button id="clearBtn" class="btn">Clear</button>
    <button id="randomBtn" class="btn">Randomize</button>

    <div class="tempo-control">
      <label for="bpmInput">BPM</label>
      <input type="range" id="bpmRange" min="40" max="220" value="120">
      <input type="number" id="bpmInput" min="40" max="220" value="120">
    </div>

    <div class="save-load">
      <button id="saveBtn" class="btn">Save Pattern</button>
      <button id="loadBtn" class="btn">Load Pattern</button>
      <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="sequencer" id="sequencer" aria-label="Step sequencer grid">
    <!-- Track rows are generated by js/main.js -->
  </section>

  <p class="hint">Click <strong>Play</strong> to start the AudioContext (browsers require a user gesture before sound can play).</p>
</main>

<footer class="app-footer">
  <p>Built with vanilla JS and the Web Audio API &mdash; no frameworks, no audio samples, no build step.</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
